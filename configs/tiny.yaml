model:
  vocab_size: 50368
  hidden_size: 256
  num_layers: 8
  num_heads: 4
  intermediate_size: 768
  max_position_embeddings: 8192

  # ModernBERT-style alternating attention
  global_attn_every_n_layers: 3
  local_attention: 128

  # RoPE
  local_rope_theta: 10000.0
  global_rope_theta: 160000.0

  # ModernBERT uses no biases in these components
  attention_bias: false
  mlp_bias: false
  norm_bias: false

  dropout: 0.0

decision_head:
  num_layers: 2
  num_heads: 4
  intermediate_size: 768
  dropout: 0.0

training:
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  dtype: float32

data:
  dataset: LocalLLaMA/typed-decisions